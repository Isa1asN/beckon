name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI runners have no sound device. Every test forces this anyway; setting it
  # here means a test that forgets to cannot start playing audio on a runner.
  BECKON_AUDIO: "null"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo test --all-features

  no-embedded-audio:
    name: build without an audio backend
    runs-on: ubuntu-latest
    # The shape a fully static musl build takes: no cpal, no libasound. Its own
    # job because feature-gated code is exactly where dead-code creeps in.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  msrv:
    name: minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo check --all-features --all-targets

  release-safety:
    name: exit-0 guarantee (release binary)
    runs-on: ubuntu-latest
    # The release profile sets `panic = "abort"`, but cargo forces unwinding for
    # test targets — so the profile users actually run is the one `cargo test`
    # can never reach. This script covers it against the real binary.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo build --release
      - run: ./scripts/verify-release-safety.sh

  packaging:
    name: crates.io packaging
    runs-on: ubuntu-latest
    # Catches a broken publish before it is permanent: crates.io versions cannot
    # be replaced. Also proves the built-in packs are in the tarball — they are
    # `include_str!`d, so a missing one fails to compile for everyone.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo package --locked
      - name: Verify the built-in packs are included
        run: |
          count=$(cargo package --locked --list | grep -c 'src/pack/builtin/.*\.toml')
          echo "built-in pack manifests in the tarball: $count"
          test "$count" -eq 3
