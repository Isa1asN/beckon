[package]
name = "beckon-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Give your AI coding agent a voice: distinct sounds for done, needs-you, and failed."
repository = "https://github.com/Isa1asN/beckon"
homepage = "https://github.com/Isa1asN/beckon"
readme = "README.md"
keywords = ["cli", "audio", "notifications", "agent", "hooks"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["docs/", "npm/", ".github/"]

[lib]
name = "beckon_cli"
path = "src/lib.rs"

[[bin]]
name = "beckon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "5"
rodio = { version = "0.21.1", default-features = false, features = [
    "playback",
    "wav",
    "vorbis",
    "flac",
    "mp3",
], optional = true }
toml_edit = "0.25.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["embedded-audio"]
# In-process playback via rodio/cpal. Optional so a fully static musl build can
# ship without linking libasound; it falls back to a system player there.
embedded-audio = ["dep:rodio"]
